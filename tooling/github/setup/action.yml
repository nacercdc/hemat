name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - uses: yarn/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: "yarn"

    - shell: bash
      run: yarn add -g turbo

    - shell: bash
      run: yarn install
