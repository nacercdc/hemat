<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Request for Health Data Submission - Africa CDC</title>
    <style>
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f4f8fb;
        color: #222;
        margin: 0;
        padding: 0;
       
      }
      .container {
        max-width: 600px;
        border: 0.5px solid #f5ecc9;
        margin: 40px auto;
        background: #ffffff;
        overflow: hidden;
      }
      .header {
        padding: 32px;
        text-align: left;
      }
      .header img {
        height: 40px;
        width: auto;
      }
      .content {
        padding: 32px;
        text-align: left;
      }
      h1 {
        font-size: 24px;
        font-weight: bold;
        color: #444;
        margin-bottom: 16px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: rgba(52, 143, 65, 0.07);
        color: #206830;
        text-decoration: none;
        border-radius: 5px;
        font-size: 14px;
        font-weight: 600;
        margin: 16px 0;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #206830;
        color: #fff;
      }
      .text-content {
        font-size: 12px;
        color: #444;
        line-height: 1.6;
        margin: 16px 0;
      }
      .text-content p {
        margin: 8px 0;
      }
      .text-content .bold {
        font-weight: bold;
      }
      .signature {
        margin-top: 32px;
        font-size: 14px;
      }
      .signature .bold {
        font-weight: 600;
      }
      .footer {
        background: #206830;
        color: #fff;
        padding: 24px 32px;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      .footer img {
        height: 28px;
        width: auto;
      }
      .footer-content {
        text-align: left;
        line-height: 1.6;
      }
      .footer-content p {
        margin: 8px 0;
      }
      .icons {
        margin: 8px 0;
      }
      .icons a {
        color: rgba(255, 255, 255, 0.7);
        margin: 0 8px;
        text-decoration: none;
      }
      .icons a:hover {
        color: #fff;
      }
      .footer-content .copyright {
        color: rgba(255, 255, 255, 0.7);
      }
      hr {
        border: none;
        border-top: 1px solid #e6f2ef;
        margin: 24px 0;
      }
      .icon {
        width: 16px;
        height: 16px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="https://africa-cdc-web-501628761718.us-west1.run.app/images/logo.png" alt="Africa CDC Logo" />
      </div>
      <div class="content">
        <h1>Request for Health Data Submission</h1>
        <a class="btn" href="{{registerUrl}}">Get Started</a>
        <div class="text-content">
          <p class="bold">Dear,</p>
          <p>
            You have been invited to join an assessment on
            <b>Africa CDC</b>.<br />
            Click the button above to accept your invitation.
          </p>
        </div>
        <div class="signature">
          <p class="bold">Best Regards,</p>
          <p>Africa CDC</p>
        </div>
      </div>
      <div class="footer">
