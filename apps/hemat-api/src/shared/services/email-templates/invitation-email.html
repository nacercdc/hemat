<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>You're Invited to Africa CDC</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f8fb;
      color: #222;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 32px 24px 24px 24px;
      border-top: 5px solid #1b7c6e;
      text-align: center;
    }
    .logo {
      font-size: 2rem;
      color: #1b7c6e;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    h2 {
      color: #1b7c6e;
      font-size: 1.3rem;
      margin-bottom: 0.7rem;
    }
    .desc {
      font-size: 1.05rem;
      color: #444;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #1b7c6e;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: 600;
      margin: 18px 0 12px 0;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #17695c;
    }
    .footer {
      font-size: 0.93rem;
      color: #888;
      margin-top: 28px;
    }
    hr {
      border: none;
      border-top: 1px solid #e6f2ef;
      margin: 24px 0 16px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Africa CDC</div>
    <h2>You're Invited!</h2>
    <div class="desc">
      You have been invited to join an assessment on <b>Africa CDC</b>.<br>
      Click the button below to accept your invitation.
    </div>
    <a class="btn" href="{{registerUrl}}">Accept Invitation</a>
    <hr>
    <div class="footer">
      If you did not expect this invitation, you can safely ignore this email.<br>
      <br>
    </div>
  </div>
</body>
</html>
