name: Build and Push Docker Images

on:
  workflow_call:
    inputs:
      artifact_registry_region:
        required: true
        type: string
      artifact_registry_host:
        required: true
        type: string
      image_prefix:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: "staging"
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT_EMAIL:
        required: true
    outputs:
      matrix_outputs:
        description: "JSON object containing all matrix job outputs"
        value: ${{ jobs.aggregate-outputs.outputs.matrix_outputs }}

permissions:
  contents: read
  id-token: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    name: Generate Matrix
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate matrix from apps directory
        id: set-matrix
        run: |
          matrix_json='{"app": []}'
         
          for dir in apps/*/ ; do
            folder_name=$(basename "$dir")
            if [ -d "$dir" ] && [ -f "$dir/deploy.conf" ]; then
              target=$(grep '^TARGET=' "$dir/deploy.conf" | cut -d'=' -f2)
              
              entry=$(jq -n \
                --arg name "$folder_name" \
                --arg target "$target" \
                --arg paths "apps/$folder_name/**,.github/workflows/**,Dockerfile,package.json,yarn.lock" \
                '{name: $name, target: $target, paths: $paths}')
              
              matrix_json=$(echo "$matrix_json" | jq ".app += [$entry]")
            fi
          done
          
          compacted_matrix=$(echo "$matrix_json" | jq -c .)
          echo "matrix=$compacted_matrix" >> $GITHUB_OUTPUT
          
          echo "Generated matrix: $compacted_matrix"
        shell: bash

  docker:
    needs: generate-matrix
    if: ${{ fromJson(needs.generate-matrix.outputs.matrix).app != null && fromJson(needs.generate-matrix.outputs.matrix).app != '' }}
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARTIFACT_REGISTRY_REGION: ${{ inputs.artifact_registry_region }}
      ARTIFACT_REGISTRY_HOST: ${{ inputs.artifact_registry_host }}
      ARTIFACT_REGISTRY_REPO: ${{ inputs.image_prefix }}-repo
      IMAGE_PREFIX: ${{ inputs.image_prefix }}
      WATCHED_PATHS: ${{ matrix.app.paths }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git diff

      - name: Check changed files
        id: check-files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})
            echo "Changed files: $CHANGED_FILES"
            PATHS=$(echo "${{ env.WATCHED_PATHS }}" | tr ',' '\n')
            MATCHED=false
            for FILE in $CHANGED_FILES; do
              for PATH in $PATHS; do
                if [[ $FILE == $PATH || $FILE == $PATH/* ]]; then
                  MATCHED=true
                  break
                fi
              done
              if [[ $MATCHED == true ]]; then
                break
              fi
            done
            echo "matched=$MATCHED" >> $GITHUB_OUTPUT
          else
            echo "matched=true" >> $GITHUB_OUTPUT # Run for push or workflow_dispatch
          fi

      - name: Authenticate to Google Cloud
        if: steps.check-files.outputs.matched == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure Docker for Artifact Registry
        if: steps.check-files.outputs.matched == 'true'
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY_REGION }}-${{ env.ARTIFACT_REGISTRY_HOST }}

      - name: Set up Docker Buildx
        if: steps.check-files.outputs.matched == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Image Tag
        id: vars
        if: steps.check-files.outputs.matched == 'true'
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:7}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="main-${GITHUB_SHA:0:7}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${GITHUB_SHA:0:7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        if: steps.check-files.outputs.matched == 'true'
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY_REGION }}-${{ env.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}:${{ steps.vars.outputs.tag }}"
          echo "Building ${{ matrix.app.name }}..."

          docker buildx build \
            --build-arg APP_NAME=${{ matrix.app.name }} \
            --target ${{ matrix.app.target }} \
            --progress plain \
            -t $IMAGE \
            --push \
            .

      - name: Save Matrix Outputs
        if: steps.check-files.outputs.matched == 'true'
        run: |
          echo "{\"image\":\"${{ env.ARTIFACT_REGISTRY_REGION }}-${{ env.ARTIFACT_REGISTRY_HOST }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}:${{ steps.vars.outputs.tag }}\",\"tag\":\"${{ steps.vars.outputs.tag }}\"}" > output-${{ matrix.app.name }}.json
          cat output-${{ matrix.app.name }}.json

      - name: Upload Matrix Outputs
        if: always() && steps.check-files.outputs.matched == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: matrix-output-${{ matrix.app.name }}
          path: output-${{ matrix.app.name }}.json
          retention-days: 1
          overwrite: true

  aggregate-outputs:
    needs: [generate-matrix, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Aggregate Outputs
    outputs:
      matrix_outputs: ${{ steps.combine.outputs.matrix_outputs }}
    steps:
      - name: Create Empty Combined Outputs
        run: |
          echo "{}" > combined.json
          echo "Created empty combined.json as fallback"

      - name: Upload Empty Combined Outputs
        uses: actions/upload-artifact@v4
        with:
          name: combined-matrix-outputs
          path: combined.json
          retention-days: 1
          overwrite: true

      - name: Download Matrix Outputs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: matrix-output-*
          merge-multiple: true
        continue-on-error: true

      - name: Combine Matrix Outputs
        id: combine
        run: |
          if compgen -G "artifacts/*.json" > /dev/null; then
            echo "Found matrix output artifacts, combining..."
            jq -c -s 'reduce .[] as $item ({}; .[$item.image | split("/")[-1] | split(":")[0] | split("${{ inputs.image_prefix }}-")[1]] = $item)' artifacts/*.json > combined.json
          else
            echo "No matrix output artifacts found, using empty JSON object"
            echo "{}" > combined.json
          fi
          echo "matrix_outputs=$(cat combined.json)" >> $GITHUB_OUTPUT
          cat combined.json

      - name: Upload Combined Outputs
        uses: actions/upload-artifact@v4
        with:
          name: combined-matrix-outputs
          path: combined.json
          retention-days: 1
          overwrite: true