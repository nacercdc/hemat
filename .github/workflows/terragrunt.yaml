name: Terragrunt Apply

on:
  workflow_call:
    inputs:
      deploy_dir:
        required: true
        type: string
      tf_args:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: "staging"
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT_EMAIL:
        required: true
      USERNAME:
        required: true
      TOKEN:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Terraform and Terragrunt
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://get.opentofu.org/opentofu.gpg | sudo tee /etc/apt/keyrings/opentofu.gpg >/dev/null
          curl -fsSL https://packages.opentofu.org/opentofu/tofu/gpgkey | sudo gpg --no-tty --batch --dearmor -o /etc/apt/keyrings/opentofu-repo.gpg >/dev/null
          sudo chmod a+r /etc/apt/keyrings/opentofu.gpg /etc/apt/keyrings/opentofu-repo.gpg
          echo \
            "deb [signed-by=/etc/apt/keyrings/opentofu.gpg,/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main
          deb-src [signed-by=/etc/apt/keyrings/opentofu.gpg,/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main" | \
            sudo tee /etc/apt/sources.list.d/opentofu.list > /dev/null
          sudo chmod a+r /etc/apt/sources.list.d/opentofu.list
          sudo apt-get update
          sudo apt-get install -y tofu

          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.81.9/terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          sudo chmod u+x /usr/local/bin/terragrunt

      - name: Configure git credentials for private GitHub modules
        run: |
          git config --global url."https://${USERNAME}:${TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          TOKEN: ${{ secrets.TOKEN }}
          USERNAME: ${{ secrets.USERNAME }}

      - name: Deploy with Terragrunt
        run: |
          cd ${{ inputs.deploy_dir }}

          # Parse the matrix_outputs JSON
          MATRIX_OUTPUTS='${{ inputs.tf_args }}'
          
          # Initialize variables
          TARGET_FLAGS=""
          IMAGE_TAG=""

          # Get all root keys from the JSON
          APP_KEYS=$(echo "$MATRIX_OUTPUTS" | jq -r 'keys[]')

          # Iterate over each app key
          for APP in $APP_KEYS; do
            # Get the tag for the current app, default to empty string if not found
            TAG=$(echo "$MATRIX_OUTPUTS" | jq -r ".\"$APP\".tag // \"\"")
            if [ -n "$TAG" ]; then
              # Convert app name from hyphen to underscore (e.g., hemat-api to hemat_api)
              CONVERTED_APP=$(echo "$APP" | tr '-' '_')
              TARGET_FLAGS="$TARGET_FLAGS -target module.$CONVERTED_APP"
              # Use the first valid tag as IMAGE_TAG if not already set
              IMAGE_TAG="${IMAGE_TAG:-$TAG}"
            fi
          done

          # Check if any targets were found
          if [ -z "$TARGET_FLAGS" ]; then
            echo "No valid targets found in matrix_outputs. Skipping terragrunt apply."
            exit 0
          fi

          # Run terragrunt commands
          echo "Running terragrunt apply with targets: $TARGET_FLAGS and image_tag: $IMAGE_TAG"
          echo "Terragrunt command: terragrunt apply -auto-approve $TARGET_FLAGS -var=\"image_tag=$IMAGE_TAG\""
          terragrunt init
          terragrunt apply -auto-approve $TARGET_FLAGS -var="image_tag=$IMAGE_TAG"